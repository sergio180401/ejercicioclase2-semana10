<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cajas sorpresa navideñas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="escena">

    <!-- Suelo con nieve -->
    <div class="suelo"></div>

    <!-- Árbol de Navidad -->
    <div class="arbol">
      <div class="estrella"></div>
      <div class="capa capa-1"></div>
      <div class="capa capa-2"></div>
      <div class="capa capa-3"></div>
      <div class="tronco"></div>

      <!-- Esferas -->
      <span class="esfera e1"></span>
      <span class="esfera e2"></span>
      <span class="esfera e3"></span>
      <span class="esfera e4"></span>
      <span class="esfera e5"></span>
      <span class="esfera e6"></span>
      <span class="esfera e7"></span>
      <span class="esfera e8"></span>
      <span class="esfera e9"></span>
    </div>

    <!-- Las 5 cajas sorpresa -->
    <div class="regalos">

      <!-- Regalo 1: rojo con lunares -->
      <div class="regalo r1">
        <div class="tapa"><span></span></div>
        <div class="promo">
          <p>Ho, ho, ho</p>
          <h2>¡Regalo!</h2>
        </div>
        <div class="caja"><span></span><span></span></div>
      </div>

      <!-- Regalo 2: verde con rayas -->
      <div class="regalo r2">
        <div class="tapa"><span></span></div>
        <div class="promo">
          <p>Para ti</p>
          <h2>¡Sorpresa!</h2>
        </div>
        <div class="caja"><span></span><span></span></div>
      </div>

      <!-- Regalo 3: azul a cuadros (el más grande) -->
      <div class="regalo r3">
        <div class="tapa"><span></span></div>
        <div class="promo">
          <p>Felices Fiestas</p>
          <h2>NAVIDAD 2026</h2>
        </div>
        <div class="caja"><span></span><span></span></div>
      </div>

      <!-- Regalo 4: morado con lunares dorados -->
      <div class="regalo r4">
        <div class="tapa"><span></span></div>
        <div class="promo">
          <p>Con cariño</p>
          <h2>Paz y amor</h2>
        </div>
        <div class="caja"><span></span><span></span></div>
      </div>

      <!-- Regalo 5: dorado con rayas verticales -->
      <div class="regalo r5">
        <div class="tapa"><span></span></div>
        <div class="promo">
          <p>Un deseo</p>
          <h2>¡Feliz 2027!</h2>
        </div>
        <div class="caja"><span></span><span></span></div>
      </div>

    </div>
  </div>

</body>
</html>
